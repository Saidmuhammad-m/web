<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #0f172a, #020617);
            color: white;
        }

        /* CONTAINER */
        .container {
            max-width: 500px;
            margin: auto;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 40px 15px;
        }

        header img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 20px #38bdf8;
        }

        h1 {
            margin: 10px 0;
        }

        /* SECTION */
        section {
            padding: 15px;
        }

        /* CARD */
        .card {
            background: rgba(255,255,255,0.05);
            padding: 18px;
            margin: 12px 0;
            border-radius: 18px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 20px #38bdf8;
        }

        /* PROJECTS */
        .projects {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .project {
            text-align: center;
        }

        /* LINK */
        a {
            color: #38bdf8;
            text-decoration: none;
        }

        a:hover {
            color: white;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 20px;
            opacity: 0.6;
        }

        /* DESKTOP VERSION */
        @media (min-width: 768px) {
            .container {
                max-width: 900px;
            }

            .projects {
                flex-direction: row;
            }
        }
    </style>
</head>
